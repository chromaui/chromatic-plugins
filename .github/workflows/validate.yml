name: validate

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow starts this on the Version Packages branch, because
  # GitHub does not run pull_request workflows on a pull request the workflow
  # token opened, and main requires the `plugins` check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap structural layer: broken JSON or a marketplace entry pointing at
      # a directory that does not exist must never reach main, because merging
      # to main is publishing once this repo is public.
      - name: Marketplace manifests are well formed
        run: |
          set -eu
          jq empty .claude-plugin/marketplace.json
          jq -e '.name and (.plugins | length > 0)' .claude-plugin/marketplace.json > /dev/null
          for source in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            test -d "$source" || { echo "marketplace entry points at missing directory: $source"; exit 1; }
          done
          jq empty .agents/plugins/marketplace.json
          jq -e '.plugins | length > 0' .agents/plugins/marketplace.json > /dev/null
          for path in $(jq -r '.plugins[].source.path' .agents/plugins/marketplace.json); do
            test -d "$path" || { echo "Codex marketplace entry points at missing directory: $path"; exit 1; }
          done
          jq empty .cursor-plugin/marketplace.json
          jq -e '.name and .owner.name and (.plugins | length > 0)' .cursor-plugin/marketplace.json > /dev/null
          for source in $(jq -r '.plugins[].source' .cursor-plugin/marketplace.json); do
            test -f "$source/.cursor-plugin/plugin.json" || { echo "Cursor marketplace entry has no .cursor-plugin/plugin.json: $source"; exit 1; }
          done

      # One version, owned by the Claude Code plugin manifest (the release
      # workflow tags from it). The package manifest must agree, and so must
      # the marketplace entry, which carries a copy because the pre-install
      # details pane in /plugin reads the version from there, not from
      # plugin.json.
      - name: Versions agree
        run: |
          set -eu
          claude_version=$(jq -r '.version' plugins/chromatic/.claude-plugin/plugin.json)
          agent_version=$(jq -r '.version' plugins/chromatic/agent-plugin/plugin.json)
          cursor_version=$(jq -r '.version' plugins/chromatic/agent-plugin/.cursor-plugin/plugin.json)
          marketplace_version=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          package_version=$(jq -r '.version' package.json)
          test "$claude_version" = "$agent_version" || { echo "plugin versions disagree: $claude_version vs $agent_version"; exit 1; }
          test "$claude_version" = "$cursor_version" || { echo "the Cursor manifest's version does not match plugin.json: $cursor_version vs $claude_version"; exit 1; }
          test "$claude_version" = "$package_version" || { echo "package.json's version does not match plugin.json: $package_version vs $claude_version. Run 'npm run version-packages', which writes all of them"; exit 1; }
          test "$claude_version" = "$marketplace_version" || { echo "the marketplace entry's version does not match plugin.json: $marketplace_version vs $claude_version"; exit 1; }

      # One plugin, two folders. plugins/chromatic is the Claude Code plugin,
      # the folder Anthropic's directory follows, which cannot move.
      # plugins/chromatic/agent-plugin is an Agent Plugins 1.0 package
      # (https://agent-plugins.org): Codex installs it, OpenAI's directory takes
      # it as a ZIP, and other agents that read the standard can install it too.
      # Claude Code reads its skills from there through plugin.json, and keeps
      # the hooks beside it, because OpenAI's directory refuses any package
      # that contains hooks.
      - name: The two folders agree
        run: |
          set -eu
          claude=plugins/chromatic
          package=plugins/chromatic/agent-plugin
          # Each side keeps its own MCP config: Claude Code and Anthropic's
          # directory want type "http", the standard allows only
          # "streamable-http". The server must be the same one, with a plain
          # URL, because Codex does not expand variables.
          claude_url=$(jq -er '.mcpServers.chromatic.url' "$claude/.mcp.json")
          package_url=$(jq -er '.mcpServers.chromatic | select(.type == "streamable-http") | .url' "$package/mcp.json")
          test "$claude_url" = "$package_url" || { echo "the MCP URLs disagree: $claude_url vs $package_url"; exit 1; }
          jq -se 'map(.mcpServers[].url | contains("$")) | any | not' "$claude/.mcp.json" "$package/mcp.json" > /dev/null || { echo "MCP configs must carry plain URLs, no variables"; exit 1; }
          jq -e '.skills == "./agent-plugin/skills/"' "$claude/.claude-plugin/plugin.json" > /dev/null || { echo "the Claude Code manifest must read its skills from the package"; exit 1; }
          test ! -e "$claude/skills" || { echo "skills belong in $package/skills, which both agents read"; exit 1; }
          test ! -e "$claude/.codex-plugin" || { echo "Codex reads $package/plugin.json; a .codex-plugin manifest would be ignored and drift"; exit 1; }

      # Cursor reads the package too, but it cannot sign in from the shared
      # mcp.json: it registers dynamically or uses a static client ID, and
      # Chromatic offers no dynamic registration. The standard's mcp.json has
      # no auth field, and an invalid one turns off MCP in every agent, so
      # Cursor gets its own MCP config beside its manifest. Other agents only
      # read plugin.json, skills/ and mcp.json, so they never see it.
      - name: Cursor signs in with the static client
        run: |
          set -eu
          package=plugins/chromatic/agent-plugin
          cursor="$package/.cursor-plugin"
          mcp=$(jq -er '.mcpServers' "$cursor/plugin.json")
          test "$mcp" = "./.cursor-plugin/mcp.json" || { echo "the Cursor manifest must read its MCP config from .cursor-plugin/mcp.json, not the shared mcp.json"; exit 1; }
          jq -e 'has("skills") | not' "$cursor/plugin.json" > /dev/null || { echo "Cursor finds the skills in skills/ on its own; a skills path would replace that"; exit 1; }
          package_url=$(jq -er '.mcpServers.chromatic.url' "$package/mcp.json")
          cursor_url=$(jq -er '.mcpServers.chromatic.url' "$cursor/mcp.json")
          test "$package_url" = "$cursor_url" || { echo "the MCP URLs disagree: $package_url vs $cursor_url"; exit 1; }
          jq -e '.mcpServers.chromatic.auth.CLIENT_ID | test("^[0-9a-f]{32}$")' "$cursor/mcp.json" > /dev/null || { echo "the Cursor MCP config needs auth.CLIENT_ID, or Cursor cannot sign in"; exit 1; }
          jq -e '.mcpServers.chromatic.auth | has("CLIENT_SECRET") | not' "$cursor/mcp.json" > /dev/null || { echo "the client is public; never ship a client secret"; exit 1; }
          jq -e '[.mcpServers[] | has("auth")] | any | not' "$package/mcp.json" > /dev/null || { echo "the shared mcp.json must stay within the Agent Plugins schema, which has no auth field"; exit 1; }

      # OpenAI's directory refuses a package with lifecycle hooks or app
      # references. Codex also loads hooks/hooks.json from a package without
      # being told to. The hooks are for Claude Code only, which finds them
      # through its own plugin.json.
      - name: The package carries no hooks
        run: |
          set -eu
          package=plugins/chromatic/agent-plugin
          found=$(find "$package" -iname '*hook*' -print)
          test -z "$found" || { echo "hooks belong in plugins/chromatic/hooks, outside the package: $found"; exit 1; }
          jq -e '.extensions["com.openai"] | (has("hooks") or has("apps")) | not' "$package/plugin.json" > /dev/null || { echo "the package manifest must not declare hooks or apps"; exit 1; }
          test ! -e "$package/.app.json" || { echo "OpenAI's directory refuses a package with app references"; exit 1; }
          # Codex 0.166 drops an MCP server whose entry has an `extensions` key, even an
          # empty one. OpenAI's sign-in settings go into the submission ZIP instead;
          # see scripts/build-openai-zip.mjs.
          jq -e '[.mcpServers[] | has("extensions")] | any | not' "$package/mcp.json" > /dev/null || { echo "the package mcp.json must not carry extensions: Codex drops the server"; exit 1; }
          hooks=$(jq -er '.hooks' plugins/chromatic/.claude-plugin/plugin.json)
          jq -e '.hooks | length > 0' "plugins/chromatic/$hooks" > /dev/null

      # The limits OpenAI's upload checks, so a listing that would be refused
      # fails here first. Source: developers.openai.com/plugins/deploy/submission.
      - name: The package meets OpenAI's listing rules
        run: |
          set -eu
          package=plugins/chromatic/agent-plugin
          manifest="$package/plugin.json"
          jq -e '."$schema" == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"' "$manifest" > /dev/null || { echo "plugin.json must name the Agent Plugins 1.0.0 schema"; exit 1; }
          jq -e '.name | test("^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$") and (length <= 64)' "$manifest" > /dev/null || { echo "name must be lowercase letters, digits and hyphens"; exit 1; }
          jq -e '(.description | length) <= 1024' "$manifest" > /dev/null || { echo "description is over 1024 characters"; exit 1; }
          ui='.extensions["com.openai"].interface'
          jq -e "$ui | (.displayName | length) <= 30 and (.shortDescription | length) <= 30 and (.longDescription | length) <= 4000" "$manifest" > /dev/null || { echo "displayName and shortDescription must be 30 characters or fewer, longDescription 4000"; exit 1; }
          for field in websiteURL supportURL privacyPolicyURL termsOfServiceURL; do
            jq -er "$ui.$field | select(startswith(\"https://\"))" "$manifest" > /dev/null || { echo "$field must be an https URL"; exit 1; }
          done
          for field in logo composerIcon; do
            icon=$(jq -er "$ui.$field" "$manifest") || { echo "$field is required"; exit 1; }
            test -f "$package/$icon" || { echo "$field points at a missing file: $icon"; exit 1; }
            size=$(file -b "$package/$icon" | grep -oE '[0-9]+ x [0-9]+')
            test "${size% x *}" = "${size#* x }" || { echo "$field must be square, got $size"; exit 1; }
          done
          # MCP review needs exactly five positive cases, each naming its tools
          # and expected result, and three negative ones. Reviewer access goes
          # through the dashboard; the upload refuses it in the package.
          review='.extensions["com.openai"].review'
          jq -e "$review.test_cases | (.positive | length) == 5 and (.negative | length) == 3" "$manifest" > /dev/null || { echo "review needs exactly 5 positive and 3 negative test cases"; exit 1; }
          jq -e "$review.test_cases | all(.positive[]; .description and .prompt and .tools_triggered and .expected_behavior) and all(.negative[]; .description and .prompt)" "$manifest" > /dev/null || { echo "every test case needs a description and prompt, and positive ones tools_triggered and expected_behavior"; exit 1; }
          jq -e "$review | (has(\"test_credentials\") or has(\"reviewer_instructions\")) | not" "$manifest" > /dev/null || { echo "reviewer credentials and instructions go in the dashboard, never the package"; exit 1; }

      # Codex reads only skills/, so a skill without its Codex manifest is
      # invisible there while Claude Code still lists it. Every skill ships
      # both files, or the surfaces drift apart without anyone noticing.
      - name: Every skill ships its Codex manifest
        run: |
          set -eu
          test ! -d plugins/chromatic/commands || { echo "commands/ is Claude Code only; put slash commands in skills/ so Codex gets them too"; exit 1; }
          for skill in plugins/chromatic/agent-plugin/skills/*/; do
            test -f "$skill/SKILL.md" || { echo "missing SKILL.md in $skill"; exit 1; }
            test -f "$skill/agents/openai.yaml" || { echo "missing agents/openai.yaml in $skill"; exit 1; }
          done

      # Pinned, so a new release of the CLI cannot change what CI runs. Raise
      # it by hand when a newer validator is needed.
      - name: Install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/chromatic

      # The run above reads the two manifests and stops there. Skills are only
      # checked when their directory is named.
      - name: Validate the skills
        run: claude plugin validate --strict plugins/chromatic/agent-plugin/skills
