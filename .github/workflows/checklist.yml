name: Checking PR checklist
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: 
  statuses: write

jobs:
  check-pr-description:
    runs-on: ubuntu-latest
    steps:
      - id: task-completed
        uses: chromaui/task-completed-checker-action@34ce9100fcd0acdf35b1320f1d5ed38ae26f46f0 # main, 2026-09-11
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
        continue-on-error: true
      - name: Update Check (failure)
        if: steps.task-completed.outcome != 'success'
        uses: ouzi-dev/commit-status-updater@26588d166ff273fc4c0664517359948f7cdc9bf1 # v2.0.2
        with:
          name: PR Checklist
          status: pending
          description: Check off PR items to proceed
      - name: Update Check (success)
        if: steps.task-completed.outcome == 'success'
        uses: ouzi-dev/commit-status-updater@26588d166ff273fc4c0664517359948f7cdc9bf1 # v2.0.2
        with:
          name: PR Checklist
          status: success
          description: All tasks checked off!
